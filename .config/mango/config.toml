# Theme
source = ~/.config/mango/colors.toml

[var]
term = "footclient"
browser = "firefox"

[env]
GTK_A11Y = "none"
GTK_BACKEND = "wayland"
GTK_SCALE = "1"
GTK_USE_PORTAL = "1"
QT_AUTO_SCREEN_SCALE_FACTOR = "1"
QT_QPA_PLATFORM = "wayland;xcb"
QT_QPA_PLATFORMTHEME = "gtk3"
QT_SCALE_FACTOR = "1.5"
QT_WAYLAND_DISABLE_WINDOWDECORATION = "1"
XCURSOR_SIZE = "16"
XDG_STATE_HOME = "~/.local/state"

[global]
exec_once = awww-daemon
exec_once = waybar
exec_once = /usr/lib/xfce4/notifyd/xfce4-notifyd
exec_once = swayidle
exec_once = lxpolkit
exec_once = nm-applet
exec_once = emacs --daemon
#exec_once = udiskie
exec_once = opensnitch-ui

blur = 1
blur_layer = 1
blur_optimized = 1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 1
layer_shadows = 1
shadow_only_floating = 0
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color = 0x000000ff

border_radius = 13
no_radius_when_single = 0
focused_opacity = 1.0
unfocused_opacity = 1.0
dim_enable = 1
dim_focused_color = 0x00000000
dim_unfocused_color = 0x00000033

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations = 1
layer_animations = 1
animation_type_open = "slide"
animation_type_close = "slide"
animation_fade_in = 1
animation_fade_out = 1
tag_animation_direction = 1
zoom_initial_ratio = 0.4
zoom_end_ratio = 0.8
fade_in_begin_opacity = 0.5
fade_out_begin_opacity = 0.8
animation_duration_move = 500
animation_duration_open = 400
animation_duration_tag = 350
animation_duration_close = 800
animation_duration_focus = 0
animation_curve_open = [0.46, 1.0, 0.29, 1]
animation_curve_move = [0.46, 1.0, 0.29, 1]
animation_curve_tag = [0.46, 1.0, 0.29, 1]
animation_curve_close = [0.08, 0.92, 0, 1]
animation_curve_focus = [0.46, 1.0, 0.29, 1]
animation_curve_opacity_fade_out = [0.5, 0.5, 0.5, 0.5]
animation_curve_opacity_fade_in = [0.46, 1.0, 0.29, 1]

# Scroller Layout Setting
scroller_structs = 6
scroller_default_proportion = 0.6667
scroller_focus_center = 0
scroller_prefer_center = 1
edge_scroller_pointer_focus = 1
edge_scroller_focus_allow_speed = 0.0
scroller_default_proportion_single = 0.6667
scroller_proportion_preset = [0.3334, 0.5, 0.6667, 1.0]

# Master-Stack Layout Setting
new_is_master = 1
default_master_factor = 0.55
default_master_count = 1
tag_num = 9
smart_gaps = 0

# Dwindle Layout Setting
dwindle_smart_split = 0
dwindle_drop_simple_split = 1
dwindle_manual_split = 0
dwindle_horizontal_split = 1
dwindle_vertical_split = 1
dwindle_preserve_split = 0

# Monocle Layout Setting
monocle_tab_mode = 1
monocle_no_border = 0
monocle_no_gap = 0

# Deck Layout Setting
deck_tab_mode = 1

# Overview Setting
hotarea_size = 10
enable_hotarea = 0
hotarea_disable_on_fullscreen = 1
overview_gap_inner = 5
overview_gap_outer = 30
overcircle_center_ratio = 0.5
title_message_bar_height = 52
title_message_bar_gap = 20

# Misc
no_border_when_single = 0
axis_bind_apply_timeout = 100
focus_on_activate = 1
idle_inhibit_ignore_visible = 0
idle_inhibit_when_fullscreen = 0
sloppy_focus = 1
warp_cursor = 1
focus_cross_monitor = 0
focus_direction_only_zone_overlap = 1
focus_cross_tag = 0
enable_floating_snap = 1
snap_distance = 30
float_full_to_top = 0
cursor_size = 24
drag_tile_to_tile = 1
drag_tile_small = 1

# keyboard
repeat_rate = 25
repeat_delay = 600
numlock_on = 0
xkb_rules_layout = "us"
xkb_rules_options = "ctrl:nocaps"

# Trackpad
# need relogin to make it apply
disable_trackpad = 0
tap_to_click = 1
tap_and_drag = 1
drag_lock = 1
trackpad_natural_scrolling =1
trackpad_disable_while_typing = 1
trackpad_left_handed = 0
trackpad_middle_button_emulation = 0
swipe_min_threshold = 1

# mouse
# need relogin to make it apply
mouse_natural_scrolling = 0

# Appearance
gap_inner_horizontal = 6
gap_inner_vertical = 6
gap_outer_horizontal = 6
gap_outer_vertical = 6
scratchpad_width_ratio = 0.8
scratchpad_height_ratio = 0.9
border_px = 2

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none
# reload config
[bind.default]
"SUPER+SHIFT+R" = "reload_config"

# Waybar
"SUPER+T" = "spawn,killall -SIGUSR1 waybar"

# menu and terminal
"SUPER+space" = "spawn,rofi -show drun"
"SUPER+Return" = "spawn_shell,$term"

# System monitor
"CTRL+SHIFT+ESCAPE" = "spawn,resources"

# exit
"SUPER+SHIFT+Q" = "quit"
"SUPER+W" = "killclient,"

# editor
"SUPER+E" = "spawn,emacsclient -c"

# applications
"SUPER+H" = "spawn,thunar"
"SUPER+L" = "spawn_shell,pkill wlogout || wlogout -b 5 -T 400px -B 400px"
"SUPER+B" = "spawn,$browser"
"SUPER+C" = "spawn_shell,pkill galculator || galculator"

# brightness and volume
"XF86AudioRaiseVolume" = "spawn,pamixer -i 5"
"XF86AudioLowerVolume" = "spawn,pamixer -d 5"
"XF86AudioMute" = "spawn,pamixer -t"
"XF86MonBrightnessUp" = "spawn,brightnessctl set +10%"
"XF86MonBrightnessDown" = "spawn,brightnessctl set 10%-"


# switch window focus
"SUPER+Tab" = "focusstack,next"
"SUPER+Left" = "focusdir,left"
"SUPER+Right" = "focusdir,right"
"SUPER+Up" = "focusdir,up"
"SUPER+Down" = "focusdir,down"

# move window
"SUPER+SHIFT+Up" = "move_client,up"
"SUPER+SHIFT+Down" = "move_client,down"
"SUPER+SHIFT+Left" = "move_client,left"
"SUPER+SHIFT+Right" = "move_client,right"

# switch window status
"SUPER+CTRL+Tab" = "togglejump,"
"SUPER+V" = "togglefloating,"
"SUPER+A" = "togglemaximizescreen,"
"SUPER+F" = "togglefullscreen,"
"SUPER+m" = "minimized,"
"SUPER+SHIFT+m" = "restore_minimized"
"SUPER+O" = "toggleoverlay,"

# scroller layout
# "ALT+e" = "set_proportion,1.0"
"SUPER+R" = "switch_proportion_preset,"
"SUPER+BRACKETLEFT" = "scroller_stack,left"
"SUPER+BRACKETRIGHT" = "scroller_stack,right"
#"SUPER+ALT+CTRL+UP" = "scroller_stack,up"
#"SUPER+ALT+CTRL+DOWN" = "scroller_stack,down"

#dwindle layout(manual split mode)
#"alt+shift+Return" = "dwindle_toggle_split_direction"

# switch layout
"SUPER+n" = "switch_layout"

# tag switch
"SUPER+PRIOR" = "viewtoleft,0"
"SUPER+NEXT" = "viewtoright,0"

#"CTRL+Right" = "viewtoright_have_client,0"
"CTRL+SUPER+Left" = "tagtoleft,0"
"CTRL+SUPER+Right" = "tagtoright,0"
"SUPER+1" = "view,1,0"
"SUPER+2" = "view,2,0"
"SUPER+3" = "view,3,0"
"SUPER+4" = "view,4,0"
"SUPER+5" = "view,5,0"
"SUPER+6" = "view,6,0"
"SUPER+7" = "view,7,0"
"SUPER+8" = "view,8,0"
"SUPER+9" = "view,9,0"

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
"SUPER+SHIFT+1" = "tagsilent,1,0"
"SUPER+SHIFT+2" = "tagsilent,2,0"
"SUPER+SHIFT+3" = "tagsilent,3,0"
"SUPER+SHIFT+4" = "tagsilent,4,0"
"SUPER+SHIFT+5" = "tagsilent,5,0"
"SUPER+SHIFT+6" = "tagsilent,6,0"
"SUPER+SHIFT+7" = "tagsilent,7,0"
"SUPER+SHIFT+8" = "tagsilent,8,0"
"SUPER+SHIFT+9" = "tagsilent,9,0"

# monitor switch
#"alt+shift+Left" = "focusmon,left"
#"alt+shift+Right" = "focusmon,right"
#"SUPER+Alt+Left" = "tagmon,left"
#"SUPER+Alt+Right" = "tagmon,right"

# movewin
"SUPER+SHIFT+ALT+Up" = "movewin,+0,-50"
"SUPER+SHIFT+ALT+Down" = "movewin,+0,+50"
"SUPER+SHIFT+ALT+Left" = "movewin,-50,+0"
"SUPER+SHIFT+ALT+Right" = "movewin,+50,+0"

# resizewin
"SUPER+ALT+Up" = "resizewin,+0,-50"
"SUPER+ALT+Down" = "resizewin,+0,+50"
"SUPER+ALT+Left" = "resizewin,-50,+0"
"SUPER+ALT+Right" = "resizewin,+50,+0"

[mousebind.default]

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
"SUPER+btn_left" = "moveresize,curmove"
"btn_middle" = "togglemaximizescreen,0"
"SUPER+btn_right" = "moveresize,curresize"

[axisbind.default]

# Axis Bindings
#"SUPER+[+UP" = "viewtoleft_have_client"
#"SUPER+]+DOWN" = "viewtoright_have_client"

[gesturebind.default]

# Gesture Bindings
"none+left+3" = "focusdir,left"
"none+right+3" = "focusdir,right"
"none+up+3" = "focusdir,up"
"none+down+3" = "focusdir,down"
"none+right+4" = "viewprev_have_client"
"none+left+4" = "viewnext_have_client"
"none+up+4" = "enteroverview"
"none+down+4" = "leaveoverview"

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller

[[rule.tag_rule]]
id = 1
layout_name = "scroller"

[[rule.tag_rule]]
id = 2
layout_name = "scroller"

[[rule.tag_rule]]
id = 3
layout_name = "scroller"

[[rule.tag_rule]]
id = 4
layout_name = "scroller"

[[rule.tag_rule]]
id = 5
layout_name = "scroller"

[[rule.tag_rule]]
id = 6
layout_name = "scroller"

[[rule.tag_rule]]
id = 7
layout_name = "scroller"

[[rule.tag_rule]]
id = 8
layout_name = "scroller"

[[rule.tag_rule]]
id = 9
layout_name = "scroller"

# layer rule

[[rule.layer_rule]]
animation_type_open = "zoom"
layer_name = "rofi"

[[rule.layer_rule]]
animation_type_close = "zoom"
layer_name = "rofi"

# Application rules
[[rule.window_rule]]
app_id = galculator
is_floating = 1
