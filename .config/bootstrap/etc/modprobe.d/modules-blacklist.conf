# Will be overwritten next time bootstrap-hyprland is run.

# PC Speaker
install pcspkr                /bin/true
install snd_pcsp              /bin/true

# Joystick
install joydev                /bin/true

# Intel Management Engine
install mei                   /bin/true
install mei_me                /bin/true

# Cannonlake???
install snd_sof_pci_intel_cnl /bin/true
install pinctrl_cannonlake    /bin/true

# PS/2 Mouse
install psmouse               /bin/true
install mousedev              /bin/true

# Bluetooth
install bluetooth             /bin/true

# Legacy devices
install ac97_bus              /bin/true

# Watchdog
install iTCO_wdt              /bin/true
install iTCO_vendor_support   /bin/true

# Telemetry
install pmt_telemetry         /bin/true
install pmt_class             /bin/true

# Intel's integrated 6xx (I think it's just those???) GPUs and i915
# driver can sometimes cause screen flickering or a system-wide hang.
# Note that you will no longer be able to use the power-switch to
# trigger hibernation,
install intel_hid             /bin/true
